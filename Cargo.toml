[package]
name = "xaml-lang-formatter"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xaml-lang-formatter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.40", features = ["encoding"] }
walkdir = "2"
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
