[package]
name = "xaml-lang-formatter-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
xaml-lang-formatter = { path = "../..", default-features = false }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false